# Let Varlock / Next resolve `.env*`; Bun's auto-loading conflicts with that order.
# See https://varlock.dev/integrations/bun/
env = false

[install]
linker = "isolated"
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = [
    "next",
    "@next/swc",
    "@next/swc-linux-x64-gnu",
    "@pandacss/cli",
    "@pandacss/compiler",
    "@pandacss/compiler-darwin-arm64",
    "@pandacss/compiler-darwin-x64",
    "@pandacss/compiler-linux-arm64-gnu",
    "@pandacss/compiler-linux-arm64-musl",
    "@pandacss/compiler-linux-x64-gnu",
    "@pandacss/compiler-linux-x64-musl",
    "@pandacss/compiler-shared",
    "@pandacss/compiler-win32-arm64-msvc",
    "@pandacss/compiler-win32-x64-msvc",
    "@pandacss/config",
    "@pandacss/dev",
    "@pandacss/mcp",
    "@pandacss/postcss",
    "@pandacss/preset-base",
    "@pandacss/preset-panda",
    "@pandacss/types",
    "@pandacss/preset-typography"
]

[test]
preload = ["./tests/setup/varlock-test-env.ts", "varlock/auto-load", "./tests/setup/test-preload.ts"]
pathIgnorePatterns = ["tests/e2e/**"]
