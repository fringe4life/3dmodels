# Let Varlock / Next resolve `.env*`; Bun's auto-loading conflicts with that order.
# See https://varlock.dev/integrations/bun/
env = false

[install]
linker = "isolated"
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = [
    "next",
    "@next/playwright",
    "@next/swc",
    "@next/swc-linux-x64-gnu",
    "ultracite",
    "@biomejs/biome",
    "@biomejs/cli-darwin-arm64",
    "@biomejs/cli-darwin-x64",
    "@biomejs/cli-linux-arm64",
    "@biomejs/cli-linux-arm64-musl",
    "@biomejs/cli-linux-x64",
    "@biomejs/cli-linux-x64-musl",
    "@biomejs/cli-win32-arm64",
    "@biomejs/cli-win32-x64",
    "@modelcontextprotocol/sdk",
    "body-parser",
    "fast-uri",
    "hono",
    "ip-address",
    "undici",
    "zod",
]

[test]
preload = ["./tests/setup/varlock-test-env.ts", "varlock/auto-load", "./tests/setup/test-preload.ts"]
pathIgnorePatterns = ["tests/e2e/**"]
