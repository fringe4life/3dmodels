# GitHub Actions pin policy:
# - Pin every `uses:` to a full commit SHA
# - Keep a same-line version comment (`# vX.Y.Z`) so Dependabot can bump both
#
# Cadence: every 3 days (cron) + cooldown 3 days, matching bunfig
# `minimumReleaseAge = 259200`. Cooldown skip does not apply to security alerts.
# https://github.com/fringe4life/3dmodels/issues/139
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      cronjob: "0 9 */3 * *"
      interval: cron
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /
    schedule:
      cronjob: "0 9 */3 * *"
      interval: cron
    cooldown:
      default-days: 3
      exclude:
        - next
        - "@next/playwright"
        - "@next/swc"
        - "@next/swc-linux-x64-gnu"
    # Bun groups do not support `dependency-type` (only bundler, composer,
    # mix, maven, npm, pip). Split by package-name patterns from package.json.
    groups:
      bun-dependencies:
        applies-to: version-updates
        patterns:
          - "@better-auth/*"
          - "@elysiajs/*"
          - "@libsql/*"
          - "@oddbird/*"
          - "@rsc-boundary/*"
          - "@varlock/bitwarden-plugin"
          - "@vercel/config"
          - babel-plugin-react-compiler
          - better-auth
          - drizzle-orm
          - elysia
          - file-type
          - next
          - next-safe-action
          - nuqs
          - react
          - react-dom
          - react-icons
          - slugify
          - uuidv7
          - valibot
          - varlock
      bun-dev-dependencies:
        applies-to: version-updates
        patterns:
          - "@biomejs/*"
          - "@happy-dom/*"
          - "@next/playwright"
          - "@pandacss/*"
          - "@playwright/test"
          - "@testing-library/*"
          - "@types/*"
          - "@varlock/nextjs-integration"
          - drizzle-kit
          - fallow
          - happy-dom
          - husky
          - lint-staged
          - next-devtools-mcp
          - react-doctor
          - typescript
          - typescript-plugin-directives
          - ultracite

