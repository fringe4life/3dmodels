# Audit workflow / Actions definitions (Socket Ch.4).
# Runs when .github/** changes; online audits use GITHUB_TOKEN.
# Readable tags + actions.lock pin commits (incl. nested). See README.md.
name: Zizmor

on:
  pull_request:
    paths: [ ".github/**" ]
  push:
    branches: [ main ]
    paths: [ ".github/**" ]

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    # PRs: read (no poison). Push: write (warm cache for later hits).
    cache-mode: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          online-audits: "true"
          token: ${{ github.token }}
          # SARIF → security tab (needs security-events: write)
          advanced-security: "true"
