# Sticky PR summary only: issues:write.
# review-comments / commit-status off → no pull-requests or statuses write.
# Readable tags + actions.lock pin commits (incl. nested). See README.md.
name: React Doctor

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]

permissions: {}

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    # Static enum only (expressions fail the run). write OK: pull_request
    # cache is merge-ref scoped; push warms default-branch cache.
    cache-mode: write
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: millionco/react-doctor@v2.4.0
        with:
          version: "0.9.17"
          comment: true
          review-comments: false
          commit-status: false
