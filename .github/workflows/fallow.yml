# Fallow PR quality gate.
#
# Changed-file audit with new-only: fail only on findings this PR introduces.
# Annotations only (no PR review-comments) → contents:read is enough.
# Readable tags + actions.lock pin commits (incl. nested). See README.md.
# Docs: https://docs.fallow.tools/integrations/ci
name: Fallow

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main ]

permissions: {}

concurrency:
  group: fallow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04-firewall
    cache-mode: read
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Panda's `@styled-system/*` output is gitignored; generate it so
      # fallow can resolve path-alias imports during the changed-file audit.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install and generate styled-system
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun ./node_modules/@pandacss/dev/bin.js build

      - uses: fallow-rs/fallow@v3.41.0
        id: fallow
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          review-comments: false
          annotations: true
          branded-token: false

      - name: Warn if PR scoping degraded
        if: steps.fallow.outputs.changed-files-unavailable == 'true'
        run: echo '::warning::Fallow ran unscoped; PR file list unavailable'
