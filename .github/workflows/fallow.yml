# Fallow PR quality gate.
#
# Changed-file audit with new-only: fail only on findings this PR introduces.
# Inline review comments (not sticky summary; not Code Scanning SARIF).
# CLI version comes from package.json (`fallow`); action ref is the wrapper pin.
# Docs: https://docs.fallow.tools/integrations/ci
name: Fallow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fallow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Panda's `@styled-system/*` output is gitignored; generate it so
      # fallow can resolve path-alias imports during the changed-file audit.
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.4.3"

      - name: Install and generate styled-system
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun x panda@2.2.0 build

      - uses: fallow-rs/fallow@fccff887da0d83db1711379e0a3696dfc2460fdd # v3.33.1
        id: fallow
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          review-comments: true
          branded-token: false

      - name: Warn if PR scoping degraded
        if: steps.fallow.outputs.changed-files-unavailable == 'true'
        run: echo '::warning::Fallow ran unscoped; PR file list unavailable'
